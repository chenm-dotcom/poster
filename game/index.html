<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Star Blaster</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #05060f;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    #wrap {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      background: #05060f;
      box-shadow: 0 0 40px rgba(80, 120, 255, 0.25);
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(() => {
  'use strict';

  // ─── Setup ────────────────────────────────────────────────────────────────
  const W = 480, H = 720;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.width = W;
  canvas.height = H;

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = W * s + 'px';
    canvas.style.height = H * s + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
  const hit = (a, b) => dist2(a, b) < (a.r + b.r) ** 2;

  // ─── Sound (tiny WebAudio synth, no assets) ───────────────────────────────
  let audio = null, muted = false;
  function initAudio() {
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audio && audio.state === 'suspended') audio.resume();
  }
  function sfx(type) {
    if (!audio || muted) return;
    const t = audio.currentTime;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.connect(g); g.connect(audio.destination);
    const presets = {
      shoot:   { wave: 'square',   f0: 880, f1: 220, vol: 0.04, dur: 0.08 },
      hit:     { wave: 'square',   f0: 300, f1: 120, vol: 0.05, dur: 0.06 },
      boom:    { wave: 'sawtooth', f0: 160, f1: 30,  vol: 0.12, dur: 0.35 },
      power:   { wave: 'triangle', f0: 440, f1: 1320, vol: 0.12, dur: 0.25 },
      hurt:    { wave: 'sawtooth', f0: 220, f1: 50,  vol: 0.15, dur: 0.5 },
      enemyShot: { wave: 'triangle', f0: 500, f1: 300, vol: 0.03, dur: 0.07 },
    };
    const p = presets[type];
    o.type = p.wave;
    o.frequency.setValueAtTime(p.f0, t);
    o.frequency.exponentialRampToValueAtTime(p.f1, t + p.dur);
    g.gain.setValueAtTime(p.vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + p.dur);
    o.start(t);
    o.stop(t + p.dur);
  }

  // ─── Input ────────────────────────────────────────────────────────────────
  const keys = {};
  const pointer = { active: false, x: 0, y: 0 };

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    initAudio();
    if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    if (e.code === 'KeyM') muted = !muted;
    if (!e.repeat && (e.code === 'Enter' || e.code === 'Space') && (state === 'title' || state === 'over')) startGame();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  function toCanvas(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  }
  canvas.addEventListener('pointerdown', e => {
    initAudio();
    if (state === 'title' || state === 'over') { startGame(); return; }
    pointer.active = true;
    Object.assign(pointer, toCanvas(e));
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (pointer.active) Object.assign(pointer, toCanvas(e));
  });
  const endPointer = () => { pointer.active = false; };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  window.addEventListener('blur', () => { if (state === 'play') togglePause(); });

  // ─── Game state ───────────────────────────────────────────────────────────
  let state = 'title'; // title | play | paused | over
  let player, bullets, enemyBullets, enemies, particles, powerups, floaters;
  let score, wave, waveTimer, spawnQueue, shake, bossAlive, flash;
  let best = Number(localStorage.getItem('starBlasterBest') || 0);

  const stars = Array.from({ length: 120 }, () => ({
    x: rand(0, W), y: rand(0, H), z: rand(0.2, 1),
  }));

  function startGame() {
    player = {
      x: W / 2, y: H - 100, r: 14, speed: 300,
      lives: 3, cooldown: 0, invuln: 2,
      power: 1, rapid: 0, shield: 0,
    };
    bullets = []; enemyBullets = []; enemies = []; particles = [];
    powerups = []; floaters = []; spawnQueue = [];
    score = 0; wave = 0; waveTimer = 1.5; shake = 0; flash = 0;
    bossAlive = false;
    state = 'play';
  }

  function togglePause() {
    if (state === 'play') state = 'paused';
    else if (state === 'paused') state = 'play';
  }

  // ─── Enemies ──────────────────────────────────────────────────────────────
  const ENEMY_TYPES = {
    // weaving drone
    drone:  { r: 14, hp: 1,  speed: 120, score: 100, color: '#ff4f7b', fireRate: 0 },
    // shoots straight down
    gunner: { r: 16, hp: 3,  speed: 80,  score: 250, color: '#ffb84f', fireRate: 1.8 },
    // dives toward the player
    diver:  { r: 12, hp: 2,  speed: 60,  score: 200, color: '#4fffb0', fireRate: 0 },
    // big, slow, aimed shots
    tank:   { r: 26, hp: 12, speed: 40,  score: 800, color: '#b06bff', fireRate: 1.2 },
    boss:   { r: 56, hp: 150, speed: 50, score: 5000, color: '#ff3b3b', fireRate: 0.5 },
  };

  function spawnEnemy(type, x, delay = 0) {
    spawnQueue.push({ type, x, delay });
  }

  function makeEnemy(type, x) {
    const t = ENEMY_TYPES[type];
    const hpScale = type === 'boss' ? 1 + (wave / 5 - 1) * 0.5 : 1 + wave * 0.05;
    return {
      type, x, y: type === 'boss' ? -80 : -30, r: t.r,
      hp: Math.ceil(t.hp * hpScale), maxHp: Math.ceil(t.hp * hpScale),
      speed: t.speed * (1 + wave * 0.03), color: t.color,
      fireTimer: rand(0.5, 1.5) * (t.fireRate || 1),
      age: 0, phase: rand(0, Math.PI * 2), baseX: x, hitFlash: 0,
      vx: 0, vy: 0,
    };
  }

  function nextWave() {
    wave++;
    floaters.push({ text: wave % 5 === 0 ? 'WARNING: BOSS' : 'WAVE ' + wave, x: W / 2, y: H / 2, life: 2, big: true });
    if (wave % 5 === 0) {
      spawnEnemy('boss', W / 2, 1.5);
      bossAlive = true;
      return;
    }
    const count = 6 + wave * 2;
    for (let i = 0; i < count; i++) {
      const roll = Math.random();
      let type = 'drone';
      if (wave >= 2 && roll < 0.25) type = 'gunner';
      if (wave >= 3 && roll > 0.8) type = 'diver';
      if (wave >= 4 && roll > 0.94) type = 'tank';
      spawnEnemy(type, rand(40, W - 40), 1 + i * Math.max(0.25, 0.7 - wave * 0.04));
    }
  }

  // ─── Shooting ─────────────────────────────────────────────────────────────
  function firePlayer() {
    const p = player;
    const shots = [];
    if (p.power === 1) shots.push([0, 0]);
    else if (p.power === 2) shots.push([-8, 0], [8, 0]);
    else if (p.power === 3) shots.push([0, 0], [-12, -0.15], [12, 0.15]);
    else shots.push([-6, 0], [6, 0], [-14, -0.2], [14, 0.2], [0, 0]);
    for (const [ox, ang] of shots) {
      bullets.push({ x: p.x + ox, y: p.y - 18, vx: Math.sin(ang) * 700, vy: -Math.cos(ang) * 700, r: 4 });
    }
    p.cooldown = p.rapid > 0 ? 0.07 : 0.14;
    sfx('shoot');
  }

  function enemyFire(e) {
    sfx('enemyShot');
    if (e.type === 'gunner') {
      enemyBullets.push({ x: e.x, y: e.y + e.r, vx: 0, vy: 260, r: 5 });
    } else if (e.type === 'tank') {
      const a = Math.atan2(player.y - e.y, player.x - e.x);
      for (const d of [-0.2, 0, 0.2]) {
        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a + d) * 220, vy: Math.sin(a + d) * 220, r: 6 });
      }
    } else if (e.type === 'boss') {
      // alternate between a ring burst and an aimed stream
      if (Math.floor(e.age / 4) % 2 === 0) {
        const n = 16;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 + e.age;
          enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 180, vy: Math.sin(a) * 180, r: 6 });
        }
      } else {
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        for (const d of [-0.3, -0.15, 0, 0.15, 0.3]) {
          enemyBullets.push({ x: e.x, y: e.y + 30, vx: Math.cos(a + d) * 260, vy: Math.sin(a + d) * 260, r: 6 });
        }
      }
    }
  }

  // ─── Effects ──────────────────────────────────────────────────────────────
  function explode(x, y, color, n = 20, power = 1) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(40, 260) * power;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.9), max: 0.9, color, size: rand(1.5, 4) });
    }
  }

  function dropPowerup(x, y) {
    const types = ['power', 'rapid', 'shield', 'life'];
    const weights = [0.4, 0.3, 0.2, 0.1];
    let r = Math.random(), type = types[0];
    for (let i = 0; i < types.length; i++) { if (r < weights[i]) { type = types[i]; break; } r -= weights[i]; }
    powerups.push({ x, y, r: 12, type, vy: 90, age: 0 });
  }

  function killEnemy(e) {
    const t = ENEMY_TYPES[e.type];
    const gained = t.score;
    score += gained;
    floaters.push({ text: '+' + gained, x: e.x, y: e.y, life: 0.8 });
    explode(e.x, e.y, e.color, e.type === 'boss' ? 120 : 24, e.type === 'boss' ? 2 : 1);
    shake = Math.max(shake, e.type === 'boss' ? 25 : e.type === 'tank' ? 10 : 4);
    sfx('boom');
    if (e.type === 'boss') {
      bossAlive = false;
      flash = 0.6;
      for (let i = 0; i < 3; i++) dropPowerup(e.x + (i - 1) * 40, e.y);
    } else if (Math.random() < (e.type === 'tank' ? 0.8 : 0.08)) {
      dropPowerup(e.x, e.y);
    }
  }

  function hurtPlayer() {
    if (player.invuln > 0) return;
    if (player.shield > 0) {
      player.shield = 0;
      player.invuln = 1;
      explode(player.x, player.y, '#4fc3ff', 30);
      sfx('hit');
      return;
    }
    player.lives--;
    player.power = Math.max(1, player.power - 1);
    player.invuln = 2.5;
    shake = 18;
    flash = 0.3;
    explode(player.x, player.y, '#7fd4ff', 50, 1.5);
    sfx('hurt');
    if (player.lives <= 0) {
      state = 'over';
      if (score > best) {
        best = score;
        localStorage.setItem('starBlasterBest', String(best));
      }
    }
  }

  // ─── Update ───────────────────────────────────────────────────────────────
  function update(dt) {
    for (const s of stars) {
      s.y += s.z * 120 * dt * (state === 'play' ? 1 : 0.4);
      if (s.y > H) { s.y = 0; s.x = rand(0, W); }
    }
    if (state !== 'play') return;

    const p = player;

    // Movement: keyboard or drag (touch/mouse keeps the ship slightly above the finger)
    let dx = 0, dy = 0;
    if (keys.ArrowLeft || keys.KeyA) dx -= 1;
    if (keys.ArrowRight || keys.KeyD) dx += 1;
    if (keys.ArrowUp || keys.KeyW) dy -= 1;
    if (keys.ArrowDown || keys.KeyS) dy += 1;
    if (dx || dy) {
      const len = Math.hypot(dx, dy);
      p.x += (dx / len) * p.speed * dt;
      p.y += (dy / len) * p.speed * dt;
    }
    if (pointer.active) {
      const tx = pointer.x, ty = pointer.y - 60;
      p.x += (tx - p.x) * Math.min(1, dt * 14);
      p.y += (ty - p.y) * Math.min(1, dt * 14);
    }
    p.x = clamp(p.x, p.r, W - p.r);
    p.y = clamp(p.y, p.r + 40, H - p.r);

    p.cooldown -= dt;
    p.invuln = Math.max(0, p.invuln - dt);
    p.rapid = Math.max(0, p.rapid - dt);
    p.shield = Math.max(0, p.shield - dt);
    // auto-fire on touch; Space / J / Z on keyboard
    if ((keys.Space || keys.KeyJ || keys.KeyZ || pointer.active) && p.cooldown <= 0) firePlayer();

    // Waves
    if (spawnQueue.length === 0 && enemies.length === 0 && !bossAlive) {
      waveTimer -= dt;
      if (waveTimer <= 0) { nextWave(); waveTimer = 2; }
    }
    for (let i = spawnQueue.length - 1; i >= 0; i--) {
      spawnQueue[i].delay -= dt;
      if (spawnQueue[i].delay <= 0) {
        enemies.push(makeEnemy(spawnQueue[i].type, spawnQueue[i].x));
        spawnQueue.splice(i, 1);
      }
    }

    // Bullets
    for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
    bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20);
    for (const b of enemyBullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
    enemyBullets = enemyBullets.filter(b => b.y < H + 20 && b.y > -40 && b.x > -20 && b.x < W + 20);

    // Enemies
    for (const e of enemies) {
      e.age += dt;
      e.hitFlash = Math.max(0, e.hitFlash - dt);
      switch (e.type) {
        case 'drone':
          e.y += e.speed * dt;
          e.x = e.baseX + Math.sin(e.age * 3 + e.phase) * 50;
          break;
        case 'gunner':
          e.y += (e.y < 140 ? e.speed : e.speed * 0.4) * dt;
          e.x = e.baseX + Math.sin(e.age + e.phase) * 30;
          break;
        case 'diver':
          if (e.age < 1.2) {
            e.y += e.speed * dt;
          } else {
            if (!e.vy) {
              const a = Math.atan2(p.y - e.y, p.x - e.x);
              e.vx = Math.cos(a) * 380; e.vy = Math.sin(a) * 380;
            }
            e.x += e.vx * dt; e.y += e.vy * dt;
          }
          break;
        case 'tank':
          e.y += (e.y < 160 ? e.speed : e.speed * 0.25) * dt;
          break;
        case 'boss':
          if (e.y < 130) e.y += e.speed * dt;
          else e.x = W / 2 + Math.sin(e.age * 0.7) * (W / 2 - 80);
          break;
      }
      const rate = ENEMY_TYPES[e.type].fireRate;
      if (rate && e.y > 0) {
        e.fireTimer -= dt;
        if (e.fireTimer <= 0) {
          enemyFire(e);
          const enraged = e.type === 'boss' && e.hp < e.maxHp / 2;
          e.fireTimer = rate * (enraged ? 0.6 : 1) * rand(0.8, 1.2) / (1 + wave * 0.04);
        }
      }
    }

    // Collisions: player bullets vs enemies
    for (const b of bullets) {
      for (const e of enemies) {
        if (e.hp > 0 && hit(b, e)) {
          b.dead = true;
          e.hp--;
          e.hitFlash = 0.06;
          particles.push({ x: b.x, y: b.y, vx: rand(-60, 60), vy: rand(-60, 60), life: 0.2, max: 0.2, color: '#fff', size: 2 });
          if (e.hp <= 0) killEnemy(e);
          else if (Math.random() < 0.3) sfx('hit');
          break;
        }
      }
    }
    bullets = bullets.filter(b => !b.dead);

    // Collisions: player vs enemies / enemy bullets
    for (const e of enemies) {
      if (e.hp > 0 && hit(p, e)) {
        hurtPlayer();
        if (e.type !== 'boss' && e.type !== 'tank') { e.hp = 0; killEnemy(e); }
      }
    }
    for (const b of enemyBullets) {
      if (hit({ x: p.x, y: p.y, r: p.r * 0.5 }, b)) { b.dead = true; hurtPlayer(); }
    }
    enemyBullets = enemyBullets.filter(b => !b.dead);
    enemies = enemies.filter(e => e.hp > 0 && e.y < H + 60 && e.x > -80 && e.x < W + 80);

    // Power-ups
    for (const u of powerups) {
      u.y += u.vy * dt; u.age += dt;
      if (hit(p, u)) {
        u.dead = true;
        sfx('power');
        const labels = { power: 'POWER UP', rapid: 'RAPID FIRE', shield: 'SHIELD', life: '1UP' };
        floaters.push({ text: labels[u.type], x: u.x, y: u.y, life: 1 });
        if (u.type === 'power') p.power = Math.min(4, p.power + 1);
        if (u.type === 'rapid') p.rapid = 8;
        if (u.type === 'shield') p.shield = 10;
        if (u.type === 'life') p.lives = Math.min(5, p.lives + 1);
      }
    }
    powerups = powerups.filter(u => !u.dead && u.y < H + 20);

    // Particles & floaters
    for (const pt of particles) {
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.96; pt.vy *= 0.96;
      pt.life -= dt;
    }
    particles = particles.filter(pt => pt.life > 0);
    for (const f of floaters) { f.life -= dt; if (!f.big) f.y -= 40 * dt; }
    floaters = floaters.filter(f => f.life > 0);

    shake = Math.max(0, shake - dt * 40);
    flash = Math.max(0, flash - dt);
  }

  // ─── Render ───────────────────────────────────────────────────────────────
  function drawShip(x, y, t) {
    ctx.save();
    ctx.translate(x, y);
    // engine flame
    const fl = 10 + Math.sin(t * 40) * 4;
    ctx.fillStyle = '#ffb347';
    ctx.beginPath();
    ctx.moveTo(-6, 12); ctx.lineTo(0, 12 + fl); ctx.lineTo(6, 12);
    ctx.fill();
    // hull
    ctx.fillStyle = '#7fd4ff';
    ctx.beginPath();
    ctx.moveTo(0, -20); ctx.lineTo(16, 14); ctx.lineTo(0, 8); ctx.lineTo(-16, 14);
    ctx.closePath();
    ctx.fill();
    // cockpit
    ctx.fillStyle = '#1b2a5c';
    ctx.beginPath();
    ctx.ellipse(0, -2, 4, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.fillStyle = e.hitFlash > 0 ? '#fff' : e.color;
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 12;
    const r = e.r;
    ctx.beginPath();
    switch (e.type) {
      case 'drone':
        ctx.moveTo(0, r); ctx.lineTo(r, -r * 0.6); ctx.lineTo(0, -r * 0.2); ctx.lineTo(-r, -r * 0.6);
        break;
      case 'gunner':
        ctx.rect(-r, -r * 0.6, r * 2, r * 1.2);
        ctx.rect(-3, r * 0.6, 6, r * 0.5);
        break;
      case 'diver':
        ctx.moveTo(0, r * 1.3); ctx.lineTo(r, -r); ctx.lineTo(-r, -r);
        break;
      case 'tank':
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2 + e.age * 0.5;
          ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        break;
      case 'boss':
        ctx.moveTo(0, r * 0.9);
        ctx.lineTo(r * 1.4, -r * 0.2); ctx.lineTo(r, -r * 0.7);
        ctx.lineTo(r * 0.3, -r * 0.4); ctx.lineTo(0, -r * 0.8);
        ctx.lineTo(-r * 0.3, -r * 0.4); ctx.lineTo(-r, -r * 0.7);
        ctx.lineTo(-r * 1.4, -r * 0.2);
        break;
    }
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    if (e.type === 'boss') {
      ctx.fillStyle = '#ffe14f';
      ctx.beginPath();
      ctx.arc(0, 0, 10 + Math.sin(e.age * 6) * 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    if (e.maxHp > 3 && e.hp < e.maxHp && e.type !== 'boss') {
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2, 3);
      ctx.fillStyle = e.color;
      ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2 * (e.hp / e.maxHp), 3);
    }
  }

  function text(str, x, y, size, color = '#fff', align = 'center') {
    ctx.font = `bold ${size}px system-ui, sans-serif`;
    ctx.textAlign = align;
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function render(t) {
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

    ctx.fillStyle = '#05060f';
    ctx.fillRect(-20, -20, W + 40, H + 40);
    for (const s of stars) {
      ctx.fillStyle = `rgba(200,220,255,${s.z})`;
      ctx.fillRect(s.x, s.y, s.z * 2.2, s.z * 2.2);
    }

    if (state === 'title') {
      ctx.restore();
      text('STAR BLASTER', W / 2, H * 0.33, 52, '#7fd4ff');
      drawShip(W / 2, H * 0.47, t);
      text('Arrows / WASD — move', W / 2, H * 0.6, 18, '#cfd8ff');
      text('Space — shoot      P — pause      M — mute', W / 2, H * 0.64, 16, '#cfd8ff');
      text('Touch: drag to move (auto-fire)', W / 2, H * 0.68, 16, '#cfd8ff');
      if (Math.floor(t * 2) % 2 === 0) text('Press SPACE or tap to start', W / 2, H * 0.8, 22, '#ffe14f');
      if (best) text('Best: ' + best, W / 2, H * 0.87, 16, '#888');
      return;
    }

    // power-ups
    const puColor = { power: '#ff8c3b', rapid: '#ffe14f', shield: '#4fc3ff', life: '#ff4f7b' };
    const puLetter = { power: 'P', rapid: 'R', shield: 'S', life: '♥' };
    for (const u of powerups) {
      ctx.save();
      ctx.translate(u.x, u.y);
      ctx.rotate(Math.sin(u.age * 4) * 0.3);
      ctx.strokeStyle = puColor[u.type];
      ctx.lineWidth = 2;
      ctx.shadowColor = puColor[u.type];
      ctx.shadowBlur = 10;
      ctx.strokeRect(-u.r, -u.r, u.r * 2, u.r * 2);
      ctx.shadowBlur = 0;
      ctx.restore();
      text(puLetter[u.type], u.x, u.y + 6, 16, puColor[u.type]);
    }

    for (const e of enemies) drawEnemy(e);

    // player bullets
    ctx.fillStyle = '#aef4ff';
    ctx.shadowColor = '#4fc3ff';
    ctx.shadowBlur = 8;
    for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
    // enemy bullets
    ctx.shadowColor = '#ff4f7b';
    for (const b of enemyBullets) {
      ctx.fillStyle = '#ff7b9c';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // player
    if (state !== 'over' && (player.invuln <= 0 || Math.floor(t * 12) % 2 === 0)) {
      drawShip(player.x, player.y, t);
      if (player.shield > 0) {
        ctx.strokeStyle = `rgba(79,195,255,${player.shield < 2 ? 0.3 + 0.3 * Math.sin(t * 20) : 0.6})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.x, player.y, 26, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    for (const pt of particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.max);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;

    for (const f of floaters) {
      ctx.globalAlpha = Math.min(1, f.life * 2);
      text(f.text, f.x, f.y, f.big ? 36 : 14, f.big ? '#ffe14f' : '#fff');
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash * 0.6})`;
      ctx.fillRect(0, 0, W, H);
    }

    // HUD
    text('SCORE ' + score, 12, 28, 18, '#fff', 'left');
    text('WAVE ' + wave, W - 12, 28, 18, '#fff', 'right');
    for (let i = 0; i < player.lives; i++) text('♥', 14 + i * 20, H - 14, 18, '#ff4f7b', 'left');
    const tags = [];
    if (player.power > 1) tags.push('PWR ' + player.power);
    if (player.rapid > 0) tags.push('RAPID ' + Math.ceil(player.rapid));
    if (player.shield > 0) tags.push('SHIELD ' + Math.ceil(player.shield));
    if (muted) tags.push('MUTED');
    text(tags.join('   '), W - 12, H - 14, 13, '#cfd8ff', 'right');

    const boss = enemies.find(e => e.type === 'boss');
    if (boss) {
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(60, 42, W - 120, 8);
      ctx.fillStyle = '#ff3b3b';
      ctx.fillRect(60, 42, (W - 120) * (boss.hp / boss.maxHp), 8);
    }

    if (state === 'paused') {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);
      text('PAUSED', W / 2, H / 2, 44);
      text('Press P to resume', W / 2, H / 2 + 36, 18, '#cfd8ff');
    }
    if (state === 'over') {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, W, H);
      text('GAME OVER', W / 2, H * 0.4, 48, '#ff4f7b');
      text('Score: ' + score, W / 2, H * 0.48, 24);
      text(score >= best && score > 0 ? 'NEW BEST!' : 'Best: ' + best, W / 2, H * 0.53, 18, '#ffe14f');
      text('Reached wave ' + wave, W / 2, H * 0.58, 16, '#cfd8ff');
      if (Math.floor(t * 2) % 2 === 0) text('Press SPACE or tap to retry', W / 2, H * 0.7, 20, '#ffe14f');
    }
  }

  // ─── Loop ─────────────────────────────────────────────────────────────────
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    render(now / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
