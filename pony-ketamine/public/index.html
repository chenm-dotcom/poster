<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pony Ketamine — long hair, micro bangs</title>
  <meta name="theme-color" content="#f4efe6">
  <!-- If these pages are hosted somewhere other than the Worker, put its URL here: -->
  <meta name="pk-api" content="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="brand">
      <h1>PONY<span>KETAMINE</span></h1>
      <p class="tag">long hair · micro bangs · zero regrets</p>
    </header>

    <!-- START -->
    <section class="screen" id="screenStart">
      <div class="hero">
        <div class="hero-face" aria-hidden="true">
          <div class="hf-hair"></div>
          <div class="hf-face"><i></i><i></i><b></b></div>
          <div class="hf-bangs"></div>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" id="btnSelfie">Take a selfie</button>
        <label class="btn ghost">
          Upload a photo
          <input type="file" id="fileInput" accept="image/*" hidden>
        </label>
      </div>
      <p class="quota" id="quota"></p>
      <p class="fine">Your photo is sent to our AI stylist only to make your cut. We don't keep it.</p>
    </section>

    <!-- CAMERA -->
    <section class="screen hidden" id="screenCamera">
      <div class="cam-wrap">
        <video id="video" playsinline autoplay muted></video>
        <div class="cam-guide"></div>
      </div>
      <div class="actions row">
        <button class="btn ghost" id="btnCamCancel">Back</button>
        <button class="btn shutter" id="btnSnap" aria-label="Take photo"></button>
        <button class="btn ghost" id="btnFlip">Flip</button>
      </div>
    </section>

    <!-- RESULT -->
    <section class="screen hidden" id="screenResult">
      <div class="stage">
        <canvas id="out"></canvas>
        <div class="busy hidden" id="busy"><div class="spinner"></div><p id="busyText">Sharpening the scissors…</p></div>
        <button class="peek hidden" id="btnPeek">Hold for before</button>
        <button class="sound" id="btnSound" aria-pressed="true">Sound on</button>
      </div>
      <p class="msg hidden" id="msg"></p>

      <div class="actions row" id="resultActions">
        <button class="btn ghost" id="btnAgain">New photo</button>
        <button class="btn primary" id="btnSave">Save</button>
      </div>
    </section>

    <!-- CLOSED: all free cuts used -->
    <section class="screen hidden" id="screenClosed">
      <div class="closed">
        <p class="closed-big">SALON<br>CLOSED</p>
        <p>All the free Pony Ketamine cuts are gone.<br>We're sweeping up the bangs. Come back soon.</p>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
